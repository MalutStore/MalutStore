<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estrenamos Tienda Online | Malut Store</title>

    <meta name="description"
          content="Malut Store ahora más cerca de ti. Conoce nuestra nueva tienda online y encuentra tus favoritos a un clic.">

    <!-- PREVIEW PARA WHATSAPP -->
    <meta property="og:title"
          content="¡Estrenamos Tienda Online! | Malut Store">

    <meta property="og:description"
          content="Malut Store ahora más cerca de ti. Explora, elige y compra tus favoritos en nuestra nueva tienda online.">

    <meta property="og:image"
          content="https://malutstore.com/images/campanas/lanzamiento-web-preview.jpg">

    <meta property="og:image:secure_url"
          content="https://malutstore.com/images/campanas/lanzamiento-web-preview.jpg">

    <meta property="og:image:type" content="image/jpeg">

    <meta property="og:url"
          content="https://malutstore.com/tienda-online/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Malut Store">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .imagen-campana {
    display: block;
    width: auto;
    max-width: 100%;
    height: 85vh;
    object-fit: contain;
}

.boton-tienda {
    width: 280px;
    padding: 9px 20px;
    margin: -55px 0 15px;

    background: linear-gradient(135deg, #d4a928, #f0c84b);
    border: 1px solid #f2ce55;
    border-radius: 12px;

    color: #111;
    text-decoration: none;
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    box-shadow: 0 4px 14px rgba(212, 169, 40, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.boton-tienda span {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
}

.boton-tienda strong {
    margin-top: 2px;
    font-size: 17px;
    font-weight: 700;
}

.boton-tienda:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(212, 169, 40, 0.4);
}

    </style>
</head>

<body>

    <img
        src="../images/campanas/lanzamiento-web.png"
        alt="Lanzamiento de la tienda online de Malut Store"
        class="imagen-campana"
    >
    <a href="https://malutstore.com/"
   class="boton-tienda">
    <span>VISÍTANOS</span>
    <strong>www.malutstore.com</strong>
</a>

</body>
