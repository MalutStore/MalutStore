name: Generar previews

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generar-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar archivos preview
        run: node generar-previews.js

      - name: Guardar previews generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/
          git diff --cached --quiet || git commit -m "Generar previews automáticamente"
          git push